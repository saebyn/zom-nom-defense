name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    container:
      image: ghcr.io/saebyn/zom-nom-defense/godot-ci:latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: "recursive"

      - name: Read Godot version
        id: godot
        run: |
          version="$(godot --version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "editor_version=$(printf '%s\n' "$version" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Cache Godot import files
        id: cache
        uses: actions/cache@v6
        with:
          path: .godot/
          key: godot-import-${{ steps.godot.outputs.version }}-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.blend', '**/*.gd', 'project.godot') }}
          restore-keys: |
            godot-import-${{ steps.godot.outputs.version }}-

      - name: Pre-configure Godot Editor Settings
        env:
          GODOT_EDITOR_VERSION: ${{ steps.godot.outputs.editor_version }}
        run: |
          config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/godot"
          mkdir -p "$config_dir"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nfilesystem/import/blender/blender_path = "/usr/bin/blender"\n' > "$config_dir/editor_settings-$GODOT_EDITOR_VERSION.tres"

      - name: Import project files
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "Running initial project import (this may take 15+ minutes)..."
          godot --headless --import --path .
          # Dialogic needs a second scan to populate its character and timeline indexes on a fresh checkout.
          godot --headless --import --path .

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        run: ./run_tests.sh

      - name: Annotate PR with test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: test-results.xml
          fail_on_failure: true
          check_name: Unit Tests
          include_passed: true

      - name: Fail if tests failed without report
        if: always() && steps.run_tests.outcome == 'failure' && hashFiles('test-results.xml') == ''
        run: exit 1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml
          retention-days: 7
