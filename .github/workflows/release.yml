name: "Release"
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      do_publish:
        description: "Set to true to publish the release"
        required: false
        default: "false"

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: zom-nom-defense-game
  PROJECT_PATH: .

jobs:
  export-game:
    name: Export ${{ matrix.platform.name }}
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/saebyn/zom-nom-defense/godot-ci:latest
    strategy:
      fail-fast: true
      matrix:
        platform:
          - name: Windows
            preset: "Windows Desktop"
            output: "zom-nom-defense-game.exe"
            directory: windows
          - name: Linux
            preset: "Linux/X11"
            output: "zom-nom-defense-game.x86_64"
            directory: linux
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: "recursive"

      - name: Setup Godot
        run: |
          version="$(godot --version)"
          case "$version" in
            "$GODOT_VERSION".stable.*) ;;
            *) echo "::error::Expected Godot $GODOT_VERSION stable, found $version. Rebuild the CI image before releasing."; exit 1 ;;
          esac
          template_dir="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates"
          mkdir -p "$template_dir"
          mv "/root/.local/share/godot/export_templates/$GODOT_VERSION.stable" "$template_dir/"

      - name: Pre-configure Godot Editor Settings
        run: |
          config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/godot"
          mkdir -p "$config_dir"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nfilesystem/import/blender/blender_path = "/usr/bin/blender"\n' > "$config_dir/editor_settings-${GODOT_VERSION%.*}.tres"

      - name: Import project files
        run: |
          echo "Running initial project import..."
          cd "$PROJECT_PATH"
          godot --headless --verbose --import --path .
          # Dialogic needs a second scan to populate its character and timeline indexes on a fresh checkout.
          godot --headless --import --path .

      - name: Apply release settings
        run: |
          cd "$PROJECT_PATH"
          bash scripts/apply_release_settings.sh project.godot

      - name: Build ${{ matrix.platform.name }}
        run: |
          mkdir -v -p build/${{ matrix.platform.directory }}
          EXPORT_DIR="$(readlink -f build)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-release "${{ matrix.platform.preset }}" "$EXPORT_DIR/${{ matrix.platform.directory }}/${{ matrix.platform.output }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.directory }}
          path: build/${{ matrix.platform.directory }}

  publish-release:
    name: Publish Release
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.do_publish == 'true' || github.event_name == 'release'
    container:
      image: ghcr.io/saebyn/zom-nom-defense/godot-ci:latest
    needs: [export-game]
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: windows
          path: windows
      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: linux
          path: linux
      - name: List downloaded artifacts
        run: |
          echo "Listing downloaded artifacts:"
          ls -laR
      - name: Upload to itch.io
        env:
          ITCHIO_GAME: ${{ vars.ITCHIO_GAME }}
          ITCHIO_USERNAME: ${{ vars.ITCHIO_USERNAME }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push windows/${{ env.EXPORT_NAME }}.exe ${ITCHIO_USERNAME}/${ITCHIO_GAME}:windows
          butler push linux/${{ env.EXPORT_NAME }}.x86_64 ${ITCHIO_USERNAME}/${ITCHIO_GAME}:linux
